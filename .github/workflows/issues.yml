on: issues
name: Issue triage
jobs:
  markIssuesForTriage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@v3
    - name: Apply Issue Triage Label
      uses: actions/github@v1.0.0
      if: github.event.action == 'opened'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        args: label needs-triage
